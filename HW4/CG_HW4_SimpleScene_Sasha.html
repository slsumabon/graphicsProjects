<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Simple Scene Emoji</title>
</head>

<body style="background-color:black; color:white; font-family:Arial;">

<!-- VERTEX SHADER SOURCE CODE: Written in GLSL -->
<script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es

in vec2 aPosition;
uniform mat3 uModelMatrix;

void main()
{
    vec3 p = uModelMatrix * vec3(aPosition, 1.0);
    gl_Position = vec4(p.xy, 0.0, 1.0);
}
</script>

<!-- FRAGMENT SHADER SOURCE CODE: Written in GLSL -->
<script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es

precision mediump float;

uniform vec4 uColor;
out vec4 fColor;

void main()
{
    fColor = uColor;
}
</script>

<div>
    <label for="leftBrowSlider">Left Eyebrow Joint</label>
    <input id="leftBrowSlider" type="range" min="-45" max="45" step="1" value="0">
</div>

<div>
    <label for="rightBrowSlider">Right Eyebrow Joint</label>
    <input id="rightBrowSlider" type="range" min="-45" max="45" step="1" value="0">
</div>

<div>
    <label for="mouthSlider">Mouth Size</label>
    <input id="mouthSlider" type="range" min="0.20" max="0.60" step="0.01" value="0.36">
</div>

<div>
    <button id="blinkButton">Blink</button>
    <button id="winkButton">Wink</button>
</div>

<p>Arrow keys move the face.</p>

<canvas id="gl-canvas" width="512" height="512"> </canvas>

<script src="MVnew-1.js"></script>
<script src="initShaders-1.js"></script>
<script src="CG_HW4_SimpleScene_Sasha.js"></script>

</body>
</html>
