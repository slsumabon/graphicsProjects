<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebGL 2.0 — Red Isosceles Triangle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #888;
    }

    h1 {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 20px;
    }

    canvas {
      display: block;
      border: 1px solid #222;
      box-shadow: 0 0 60px rgba(220, 30, 30, 0.15);
    }

    p {
      margin-top: 16px;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>OpenGL ES 3 &nbsp;/&nbsp; WebGL 2.0</h1>
  <canvas id="glCanvas" width="400" height="400"></canvas>
  <p>vertex shader &nbsp;·&nbsp; fragment shader &nbsp;·&nbsp; red isosceles triangle</p>

  <script>
    // ─── Canvas & WebGL 2.0 context ───────────────────────────────────────────
    const canvas = document.getElementById('glCanvas');
    const gl = canvas.getContext('webgl2');

    if (!gl) {
      alert('WebGL 2.0 is not supported by your browser.');
      throw new Error('WebGL 2 unavailable');
    }

    // ─── OpenGL ES 3 Vertex Shader ────────────────────────────────────────────
    // Uses GLSL ES 3.00 (#version 300 es)
    // Positions supplied in pixel space; transformed to clip space via uniform.
    const vertexShaderSource = `#version 300 es
      // Uniform transform: converts pixel coords → NDC clip space
      uniform vec2 u_resolution;

      // Per-vertex position in pixel coordinates
      in vec2 a_position;

      void main() {
        // Map pixel coords (0..width, 0..height) to clip space (-1..1, -1..1)
        // Origin at canvas top-left; Y-axis points downward in pixel space.
        vec2 clipSpace = (a_position / u_resolution) * 2.0 - 1.0;

        // Flip Y so that Y+ points upward in clip space (WebGL convention)
        gl_Position = vec4(clipSpace.x, -clipSpace.y, 0.0, 1.0);
      }
    `;

    // ─── OpenGL ES 3 Fragment Shader ──────────────────────────────────────────
    const fragmentShaderSource = `#version 300 es
      precision highp float;

      // Output colour for this fragment
      out vec4 fragColor;

      void main() {
        // Solid red — full opacity
        fragColor = vec4(1.0, 0.0, 0.0, 1.0);
      }
    `;

    // ─── Shader compilation helper ────────────────────────────────────────────
    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const info = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error('Shader compile error:\n' + info);
      }
      return shader;
    }

    // ─── Build program ────────────────────────────────────────────────────────
    const vertShader  = compileShader(gl.VERTEX_SHADER,   vertexShaderSource);
    const fragShader  = compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource);

    const program = gl.createProgram();
    gl.attachShader(program, vertShader);
    gl.attachShader(program, fragShader);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      const info = gl.getProgramInfoLog(program);
      gl.deleteProgram(program);
      throw new Error('Program link error:\n' + info);
    }

    // Shaders are now baked into the program; we can release the individual objects.
    gl.deleteShader(vertShader);
    gl.deleteShader(fragShader);

    // ─── Triangle geometry (pixel coordinates) ───────────────────────────────
    //
    //   Canvas: 400 × 400 px
    //   Triangle height : 200 px
    //   Triangle base   : 150 px
    //
    //   Centre of canvas: (200, 200)
    //
    //   Apex  : (200, 100)          ← centred horizontally, 100 px from top
    //   Base-L: (125, 300)          ← 75 px left of centre
    //   Base-R: (275, 300)          ← 75 px right of centre
    //
    //   (Y-axis points downward in pixel space.)

    const canvasW = canvas.width;   // 400
    const canvasH = canvas.height;  // 400

    const cx = canvasW / 2;         // 200  — horizontal centre
    const cy = canvasH / 2;         // 200  — vertical centre
    const halfHeight = 100;         // 200 px total height → ±100 from centre
    const halfBase   = 75;          // 150 px base width   → ±75  from centre

    //  Apex at (cx, cy - halfHeight)  → (200, 100)
    //  Base-L at (cx - halfBase, cy + halfHeight) → (125, 300)
    //  Base-R at (cx + halfBase, cy + halfHeight) → (275, 300)
    const vertices = new Float32Array([
      cx,              cy - halfHeight,   // apex
      cx - halfBase,   cy + halfHeight,   // bottom-left
      cx + halfBase,   cy + halfHeight,   // bottom-right
    ]);

    // ─── Vertex Array Object + Buffer ─────────────────────────────────────────
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);

    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

    // Wire up the 'a_position' attribute (2 floats, no stride/offset)
    const posAttribLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posAttribLoc);
    gl.vertexAttribPointer(
      posAttribLoc,
      2,          // components per vertex (x, y)
      gl.FLOAT,   // data type
      false,      // normalise?
      0,          // stride  (tightly packed)
      0           // offset into buffer
    );

    gl.bindVertexArray(null);   // unbind VAO

    // ─── Render ───────────────────────────────────────────────────────────────
    gl.viewport(0, 0, canvasW, canvasH);

    // Clear to a very dark background so the red pops.
    gl.clearColor(0.05, 0.05, 0.06, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(program);

    // Upload canvas resolution so the vertex shader can do the pixel→clip transform.
    const resolutionLoc = gl.getUniformLocation(program, 'u_resolution');
    gl.uniform2f(resolutionLoc, canvasW, canvasH);

    gl.bindVertexArray(vao);
    gl.drawArrays(
      gl.TRIANGLES,  // primitive type
      0,             // starting vertex index
      3              // number of vertices
    );
    gl.bindVertexArray(null);
  </script>

</body>
</html>
