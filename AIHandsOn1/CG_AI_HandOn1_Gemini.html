<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 2 Red Isosceles Triangle</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #222; 
        }
        canvas { 
            border: 1px solid #555; 
            background-color: black; 
        }
    </style>
</head>
<body>

<canvas id="glCanvas" width="400" height="400"></canvas>

<script id="vs" type="x-shader/x-vertex">#version 300 es
    in vec2 a_position;
    void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
    }
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
    precision highp float;
    out vec4 outColor;
    void main() {
        // R, G, B, A
        outColor = vec4(1.0, 0.0, 0.0, 1.0); 
    }
</script>

<script>
    function main() {
        const canvas = document.querySelector("#glCanvas");
        const gl = canvas.getContext("webgl2");

        if (!gl) {
            alert("WebGL 2 is not supported by your browser.");
            return;
        }

        // Helper function to compile shaders
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error("Shader compile error:", gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        // Initialize Shaders and Program
        const vsSource = document.getElementById("vs").text.trim();
        const fsSource = document.getElementById("fs").text.trim();
        
        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error("Program link error:", gl.getProgramInfoLog(program));
            return;
        }

        // Define triangle vertices mapped to NDC
        const positions = new Float32Array([
             0.0,    0.5,   // Top vertex
            -0.375, -0.5,   // Bottom left
             0.375, -0.5    // Bottom right
        ]);

        // Create Vertex Array Object (VAO) and Buffer
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        // Bind data to the shader's 'a_position' attribute
        const positionLoc = gl.getAttribLocation(program, "a_position");
        gl.enableVertexAttribArray(positionLoc);
        gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

        // Rendering setup
        gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
        gl.clearColor(0.0, 0.0, 0.0, 1.0); // Black background
        gl.clear(gl.COLOR_BUFFER_BIT);

        // Draw the triangle
        gl.useProgram(program);
        gl.bindVertexArray(vao);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // Run the program
    main();
</script>
</body>
</html>
